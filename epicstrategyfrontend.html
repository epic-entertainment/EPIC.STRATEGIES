<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>EPIC STRATEGIES</title>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}

body,h1,h2,h3,p,button,#status,#clueText{

  text-shadow:
    -1px -1px 0 black,
     1px -1px 0 black,
    -1px  1px 0 black,
     1px  1px 0 black,
     0px 0px 6px black;
}

#app{

  width:100vw;
  height:100vh;

  display:flex;
  flex-direction:column;
  align-items:center;

  box-sizing:border-box;

  padding:10px;
}

.page{
  width:100%;
  text-align:center;
}

.menu-button{

  width:90%;
  max-width:320px;

  padding:16px;

  margin:8px 0;

  font-size:18px;

  border:none;
  border-radius:12px;

  color:white;
}

#gamePage{

  display:none;

  width:100%;
  height:100%;
}

#status{
  margin:8px 0;
  font-size:20px;
}

#topBar{

  display:flex;

  justify-content:center;

  gap:8px;

  margin-bottom:8px;
}

.small-btn{

  padding:10px 14px;

  border:none;
  border-radius:10px;

  color:white;

  font-size:16px;
}

#boardWrapper{

  width:100%;
  height:75vh;

  overflow:auto;

  border:2px solid rgba(255,255,255,0.2);

  touch-action:none;

  background:rgba(0,0,0,0.15);

  -webkit-overflow-scrolling:touch;
}

#board{

  display:grid;

  grid-template-columns:
    repeat(30,34px);

  grid-template-rows:
    repeat(30,34px);

  width:max-content;
  height:max-content;
}

.cell{

  width:34px;
  height:34px;

  background:#d2a679;

  border:1px solid rgba(0,0,0,0.15);

  box-sizing:border-box;
}

.preview{
  outline:3px solid red;
}

#clueText{
  margin-top:10px;
  font-size:18px;
}

#donate{

  position:fixed;

  bottom:4px;
  left:0;

  width:100%;

  text-align:center;

  font-size:10px;

  opacity:0.7;
}

#donate a{
  color:white;
  text-decoration:none;
}

</style>

</head>

<body>

<div id="app">

  <div id="menu" class="page">

    <h1>EPIC STRATEGIES</h1>

    <button class="menu-button"
      onclick="showPage('playMenu')">

      PLAY

    </button>

    <button class="menu-button"
      onclick="showPage('cluePage')">

      GET CLUES

    </button>

    <button class="menu-button"
      onclick="showPage('howTo')">

      HOW TO PLAY

    </button>

  </div>

  <div id="playMenu"
       class="page"
       style="display:none;">

    <h1>SELECT MODE</h1>

    <button class="menu-button"
      onclick="startGame(2)">

      1 VS CPU

    </button>

    <button class="menu-button"
      onclick="startGame(3)">

      1 VS 2 CPU

    </button>

    <button class="menu-button"
      onclick="startGame(4)">

      1 VS 3 CPU

    </button>

    <button class="menu-button"
      onclick="showPage('menu')">

      BACK

    </button>

  </div>

  <div id="gamePage">

    <div id="status">
      Waiting...
    </div>

    <div id="topBar">

      <button id="clueButton"
        class="small-btn"
        onclick="useClue()"
        disabled>

        NO CLUE

      </button>

      <button class="small-btn"
        onclick="showPage('menu')">

        EXIT

      </button>

    </div>

    <div id="boardWrapper">
      <div id="board"></div>
    </div>

    <div id="clueText"></div>

  </div>

  <div id="cluePage"
       class="page"
       style="display:none;">

    <h1>CLUES</h1>

    <p>
      Watch videos to gain clues.
    </p>

    <button class="menu-button"
      onclick="watchAd()">

      WATCH VIDEO (+2 CLUES)

    </button>

    <div id="clues">
      Clues: 0
    </div>

    <button class="menu-button"
      onclick="showPage('menu')">

      BACK

    </button>

  </div>

  <div id="howTo"
       class="page"
       style="display:none;">

    <h1>HOW TO PLAY</h1>

    <p>
      Use clues only when danger appears.
    </p>

    <p>
      Drag board with finger.
    </p>

    <button class="menu-button"
      onclick="showPage('menu')">

      BACK

    </button>

  </div>

</div>

<div id="donate">
  <a href="#">
    adopt a dev
  </a>
</div>

<script>

const API =
"https://epic-strategies.onrender.com";

let gameId = null;

let currentPlayer = "p1";

let clues = 0;

let currentThreat = null;

let previewCell = null;

const palette = [

  "#1f2937",
  "#3b0764",
  "#0f766e",
  "#7c2d12",
  "#374151",
  "#1e3a8a",
  "#4a044e"
];

const buttonPalette = [

  "#16a34a",
  "#2563eb",
  "#dc2626",
  "#9333ea",
  "#ca8a04",
  "#0f766e"
];

function randomizeTheme(){

  const bg =
    palette[
      Math.floor(
        Math.random()*palette.length
      )
    ];

  document.body.style.background =
    bg;

  const buttons =
    document.querySelectorAll(
      ".menu-button,.small-btn"
    );

  buttons.forEach(btn=>{

    btn.style.background =
      buttonPalette[
        Math.floor(
          Math.random()*buttonPalette.length
        )
      ];
  });
}

randomizeTheme();

function showPage(page){

  [
    "menu",
    "playMenu",
    "gamePage",
    "cluePage",
    "howTo"
  ].forEach(id=>{

    document.getElementById(id)
      .style.display = "none";
  });

  document.getElementById(page)
    .style.display = "block";

  randomizeTheme();
}

async function startGame(mode){

  showPage("gamePage");

  let players = [];

  if(mode === 2){

    players = [
      "p1",
      "cpu2"
    ];
  }

  if(mode === 3){

    players = [
      "p1",
      "cpu2",
      "cpu3"
    ];
  }

  if(mode === 4){

    players = [
      "p1",
      "cpu2",
      "cpu3",
      "cpu4"
    ];
  }

  const res =
    await fetch(API+"/games",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify(players)
  });

  const data = await res.json();

  gameId = data.game_id;

  currentPlayer =
    data.next_turn;

  renderBoard(data.board);

  updateThreat(data.threat);

  document.getElementById("status")
    .innerText =
      "Turn: " + currentPlayer;
}

function renderBoard(board){

  const boardDiv =
    document.getElementById("board");

  boardDiv.innerHTML = "";

  board.forEach((row,y)=>{

    row.forEach((cell,x)=>{

      const div =
        document.createElement("div");

      div.className = "cell";

      if(cell){

        div.style.background =

          cell==="p1" ? "black" :

          cell==="cpu2" ? "white" :

          cell==="cpu3" ? "blue" :

          "green";
      }

      div.addEventListener(
        "touchstart",
        ()=>previewMove(div)
      );

      div.addEventListener(
        "touchmove",
        ()=>previewMove(div)
      );

      div.addEventListener(
        "touchend",
        ()=>makeMove(x,y)
      );

      div.onclick =
        ()=>makeMove(x,y);

      boardDiv.appendChild(div);
    });
  });
}

function previewMove(div){

  if(previewCell){

    previewCell.classList.remove(
      "preview"
    );
  }

  previewCell = div;

  previewCell.classList.add(
    "preview"
  );
}

function updateThreat(threat){

  currentThreat = threat;

  const btn =
    document.getElementById(
      "clueButton"
    );

  if(threat){

    btn.disabled = false;

    btn.innerText =
      "CLUE READY";

  } else {

    btn.disabled = true;

    btn.innerText =
      "NO CLUE";
  }
}

async function makeMove(x,y){

  if(!gameId) return;

  const res =
    await fetch(API+"/move",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      game_id:gameId,

      player:"p1",

      x,y
    })
  });

  if(!res.ok) return;

  const data =
    await res.json();

  renderBoard(data.board);

  updateThreat(data.threat);

  if(data.winner){

    document.getElementById("status")
      .innerText =
      "WINNER: " + data.winner;

    alert(
      "Winner: " + data.winner
    );

    gameId = null;

    return;
  }

  currentPlayer =
    data.next_turn;

  document.getElementById("status")
    .innerText =
      "Turn: " + currentPlayer;
}

function useClue(){

  if(clues <= 0){

    document.getElementById("clueText")
      .innerText =
      "No clues available.";

    return;
  }

  if(!currentThreat){

    document.getElementById("clueText")
      .innerText =
      "No threat detected.";

    return;
  }

  clues--;

  document.getElementById("clues")
    .innerText =
      "Clues: " + clues;

  document.getElementById("clueText")
    .innerText =
      "Danger near row "
      + currentThreat.row;
}

function watchAd(){

  alert(
    "Rewarded video placeholder"
  );

  setTimeout(()=>{

    clues += 2;

    document.getElementById("clues")
      .innerText =
        "Clues: " + clues;

  },1000);
}

showPage("menu");

</script>

</body>
</html>
